<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SF6 豪鬼 コンボビルダー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:760px;margin:0 auto;padding:18px}
section{background:#1b1d21;border:1px solid #35383e;border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:18px;margin:0 0 10px}
.small{color:#a9adb5;font-size:13px;line-height:1.5}
label{display:block;font-size:13px;color:#a9adb5;margin-bottom:5px}
select,button{width:100%;min-height:50px;border-radius:10px;border:1px solid #4a4e56;background:#272a30;color:#fff;padding:12px;font-size:16px}
button{font-weight:700;cursor:pointer}
button:active{transform:translateY(1px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.data-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.data{background:#25282e;border-radius:9px;padding:9px}
.data small{display:block;color:#9297a0;font-size:11px}
.data b{font-size:16px}
.route{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.route-item{display:flex;align-items:center;justify-content:space-between;background:#25282e;border-radius:9px;padding:10px 12px}
.route-name{font-weight:600}
.route-dmg{font-weight:800;white-space:nowrap}
.total-label{color:#a9adb5;font-size:13px;margin-top:16px}
.total{font-size:40px;font-weight:900;line-height:1.1;margin-top:2px}
.status{min-height:20px;margin:10px 0 0}
.ok{color:#9fe6a0}
.notice{background:#24272d;border-radius:9px;padding:10px;margin-bottom:12px}.state-known{color:#9fe6a0}.state-unknown{color:#f2c879}.data b{overflow-wrap:anywhere}
@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:1fr}}

.validity-box{margin-top:10px;padding:10px 12px;border-radius:8px;background:#f3f4f6;font-size:14px}
.validity-ok{color:#166534}
.validity-ng{color:#b91c1c;background:#fef2f2}

#nextSlots{display:flex;flex-direction:column;gap:8px}
#nextSlots label{margin-top:4px}
#nextSlots select{margin-bottom:4px}
</style>
</head>

<body>
<main>
<section>
<h1>SF6 豪鬼 コンボビルダー</h1>
<p class="small">始動技を選び、次の技を順番に追加します。現段階では始動補正のみ反映します。</p>
<div class="notice small">例：立ち弱P 300 → 立ち中P 600 = <b>780 damage</b></div>
<div class="notice small">※「相手の状態」と「ヒット状態」を選択できます。資料で確認できない状態別フレームは「未登録」と表示し、推測値は入れていません。</div>
<div class="grid">
<div><label for="opponentState">相手の状態</label><select id="opponentState"><option value="standing">立ち</option><option value="crouching">しゃがみ</option><option value="airborne">空中</option><option value="down">ダウン</option><option value="wall">壁やられ</option>
<option value="burnout">バーンアウト</option></select></div>
<div><label for="hitState">ヒット状態</label><select id="hitState"><option value="normal">通常ヒット</option><option value="counter">カウンターヒット</option><option value="punish">パニッシュカウンター</option><option value="block">ガード</option>
</select></div>
</div>
<div id="conditionStatus" class="small status">条件：立ち / 通常ヒット</div>
</section>

<section>
<h2>① 始動技</h2>
<label for="starter">始動技を選択</label>
<select id="starter">
  <option value="">始動技を選択してください</option>
</select>
<div class="data-grid">
  <div class="data"><small>技</small><b id="starterName">—</b></div>
  <div class="data"><small>ダメージ</small><b id="starterDamage">—</b></div>
  <div class="data"><small>始動補正</small><b id="starterCorrection">—</b></div>
</div>
</section>

<section>
<h2>② コンボを組み立てる</h2>
<div id="nextSlots">
  <label for="next">2つ目の技</label>
  <select id="next" disabled>
    <option value="">先に始動技を選択してください</option>
  </select>
</div>
<div class="data-grid">
  <div class="data"><small>技</small><b id="nextName">—</b></div>
  <div class="data"><small>ダメージ</small><b id="nextDamage">—</b></div>
  <div class="data"><small>発生</small><b id="nextStartup">—</b></div>
  <div class="data"><small>ヒット</small><b id="nextHit">—</b></div>
  <div class="data"><small>状態別フレーム</small><b id="nextStateFrame">—</b></div>
  <div class="data"><small>状態メモ</small><b id="nextStateNote">—</b></div>
</div>

<div class="grid" style="margin-top:10px">
  <button id="add" type="button" disabled>＋ コンボに追加</button>
  <button id="clear" type="button">コンボをクリア</button>
</div>
<p id="status" class="small status">始動技を選択してください。</p>
</section>

<section>
<h2>③ コンボ</h2>
<div id="route" class="route"></div>
<div class="total-label">合計ダメージ</div>
<div id="damage" class="total">0 damage</div>
</section>

var combo = [];

var starter = document.getElementById("starter");
var next = document.getElementById("next");
var add = document.getElementById("add");
var clear = document.getElementById("clear");

var starterName = document.getElementById("starterName");
var starterDamage = document.getElementById("starterDamage");
var starterCorrection = document.getElementById("starterCorrection");
var nextName = document.getElementById("nextName");
var nextDamage = document.getElementById("nextDamage");
var nextStartup = document.getElementById("nextStartup");
var nextHit = document.getElementById("nextHit");
var nextStateFrame = document.getElementById("nextStateFrame");
var nextStateNote = document.getElementById("nextStateNote");
var opponentState = document.getElementById("opponentState");
var hitState = document.getElementById("hitState");
var conditionStatus = document.getElementById("conditionStatus");

// 資料で確認できた状態差だけを登録。未確認値は推測しない。
var CONDITION_DATA = {
  crHK: { punish: { note: "ダウン時間増加・ハードノックダウン" } },
  goujin_L1_M: { punish: { plusFrame: 10, note: "パニッシュカウンター時 +10F" } },
  goujin_L1_H: { punish: { plusFrame: 12, note: "パニッシュカウンター時 +12F" } },
  goujin_OD1: { punish: { note: "膝崩れダウンに +39F" } },
  drive_impact: { punish: { note: "パニッシュカウンターで性能変化" }, counter: { note: "アーマー成立後ヒット等で性能変化" } },
  oboro: { punish: { damage: 2900, note: "パニッシュカウンター時ダメージ2900" } },
  goushouha_throw: { punish: { damage: 2040, note: "パニッシュカウンター時ダメージ2040・ハードノックダウン" } },
  shuretsuto_throw: { punish: { damage: 2040, note: "パニッシュカウンター時ダメージ2040・ハードノックダウン" } }
};

function getCondition(move) {
  if (!move) return null;
  var byMove = CONDITION_DATA[move.id];
  return byMove ? (byMove[hitState.value] || null) : null;
}
function getConditionLabel() {
  return opponentState.options[opponentState.selectedIndex].textContent + " / " + hitState.options[hitState.selectedIndex].textContent;
}
function updateConditionUI() {
  conditionStatus.textContent = "条件：" + getConditionLabel();
  updateNext();
  render();
  updateComboValidity();
}

var route = document.getElementById("route");
var damage = document.getElementById("damage");
var status = document.getElementById("status");

function getMove(value) {
  return MOVE_DATA[String(value)] || null;
}

function populateSelect(select) {
  select.innerHTML = "";
  Object.keys(MOVE_DATA).forEach(function(value) {
    var move = MOVE_DATA[value];
    select.add(new Option(move.displayName, value));
  });
}

function updateStarter() {
  var move = getMove(starter.value);

  if (!move) {
    starterName.textContent = "—";
    starterDamage.textContent = "—";
    starterCorrection.textContent = "—";
    return;
  }

  starterName.textContent = move.displayName;
  starterDamage.textContent = move.damage + " dmg";
  starterCorrection.textContent =
    move.starterCorrection < 1
      ? Math.round(move.starterCorrection * 100) + "%"
      : "100%";
}

function getActiveNextSelect() {
  var selects = document.querySelectorAll("#nextSlots select");
  return selects.length ? selects[selects.length - 1] : null;
}

function updateNext(select) {
  select = select || getActiveNextSelect();
  if (!select) return;

  var move = getMove(select.value);
  var f = move ? (move.frame || {}) : {};
  var condition = getCondition(move);

  if (!move) {
    nextName.textContent = "—"; nextDamage.textContent = "—"; nextStartup.textContent = "—"; nextHit.textContent = "—";
    nextStateFrame.textContent = "—"; nextStateNote.textContent = "—"; add.disabled = true;
    return;
  }

  nextName.textContent = move.displayName;
  var shownDamage = condition && condition.damage != null ? condition.damage : move.damage;
  nextDamage.textContent = shownDamage + " dmg" + (condition && condition.damage != null ? " ※状態補正" : "");
  nextStartup.textContent = f.startup || "—";
  nextHit.textContent = f.onHit || "—";

  var adjusted = getSituationAdvantage(move);
  if (adjusted !== null) {
    nextStateFrame.textContent = (adjusted >= 0 ? "+" : "") + adjusted + "F";
    nextStateFrame.className = "state-known";
  } else if (condition && condition.note) {
    nextStateFrame.textContent = "特殊状態";
    nextStateFrame.className = "state-known";
  } else {
    nextStateFrame.textContent = "未登録";
    nextStateFrame.className = "state-unknown";
  }

  nextStateNote.textContent = condition && condition.note ? condition.note : "この条件の追加フレーム値は未登録";
  add.disabled = false;
  updateComboValidity();
}


/* ===== Combo validity layer =====
   This first pass uses the currently selected opponent/hit state and the
   displayed on-hit advantage where the source data provides a numeric value.
   It deliberately avoids guessing exact cancel routes.
*/
function numericFrame(v){
  if (v === null || v === undefined) return null;
  var s = String(v).trim();
  var m = s.match(/^-?\d+/);
  return m ? parseInt(m[0],10) : null;
}
/* バーンアウト時はガード硬直差のみ+4F。ヒット時の有利Fは変更しない。 */
function getSituationAdvantage(move){
  if (!move || !move.frame) return null;
  var opponent = document.getElementById('opponentState');
  var os = opponent ? opponent.value : 'standing';

  var state = document.getElementById('hitState');
  var hs = state ? state.value : 'normal';

  /*
    Burnout rule:
    The +4F applies to block stun, not hit advantage.
    Therefore only when the selected situation is a guarded attack,
    use onBlock + 4F. Hit / Counter / Punish keep their respective onHit values.
  */
  if (os === 'burnout' && hs === 'block') {
    var block = numericFrame(move.frame.onBlock);
    return block === null ? null : block + 4;
  }

  var base = move.frame.onHit;
  var n = numericFrame(base);
  /* Known source notes with explicit counter/Punish additions. */
  if (hs === 'counter' && move.id === 'goujin_L1_M') n = 12;
  if (hs === 'punish' && move.id === 'goujin_L1_M') n = 12;
  if (hs === 'punish' && move.id === 'goujin_L1_H') n = 15;
  return n;
}
function getNextStartup(move){
  return move && move.frame ? numericFrame(move.frame.startup) : null;
}
function comboCheck(previous, next){
  if (!previous || !next) return {ok:true, text:'判定対象外'};
  var adv = getSituationAdvantage(previous);
  var startup = getNextStartup(next);
  if (adv === null || startup === null) {
    return {ok:true, text:'フレーム未登録（仮許可）'};
  }
  if (adv >= startup) {
    return {ok:true, text:'繋がる可能性あり（' + adv + 'F ＞ ' + startup + 'F）'};
  }
  return {ok:false, text:'フレーム上は繋がらない（' + adv + 'F ＜ ' + startup + 'F）'};
}
function updateComboValidity(){
  var msg = document.getElementById('validityStatus');
  if (!msg) return;
  if (!combo.length) {
    msg.innerHTML = 'コンボ成立判定：始動技を選択してください';
    return;
  }
  var previous = getMoveByValue(combo[combo.length-1]);
  var activeSelect = getActiveNextSelect();
  var next = activeSelect ? getMove(activeSelect.value) : null;
  if (!next) {
    msg.innerHTML = 'コンボ成立判定：次の技を選択してください';
    return;
  }
  var result = comboCheck(previous, next);
  msg.innerHTML = 'コンボ成立判定：<strong>' + result.text + '</strong>';
  msg.className = result.ok ? 'validity-ok' : 'validity-ng';
}

function render() {
  var first = getMove(starter.value);

  if (!first) {
    route.innerHTML = "";
    damage.textContent = "0 damage";
    return;
  }

  var total = Number(first.damage) || 0;
  var html = '<div class="route-item"><span class="route-name">1. ' +
    first.displayName + '</span><span class="route-dmg">' +
    first.damage + ' dmg</span></div>';

  for (var i = 0; i < combo.length; i++) {
    var move = getMove(combo[i]);
    if (!move) continue;

    var rate = (i === 0) ? first.starterCorrection : 1;
    var condition = getCondition(move);
    var baseDamage = condition && condition.damage != null ? condition.damage : (Number(move.damage) || 0);
    var shownDamage = Math.floor(baseDamage * rate);
    total += shownDamage;

    html += '<div class="route-item"><span class="route-name">' +
      (i + 2) + '. ' + move.displayName +
      '</span><span class="route-dmg">' +
      shownDamage + ' dmg' +
      (rate < 1 ? ' <small>(' + Math.round(rate * 100) + '%)</small>' : '') +
      '</span></div>';
  }

  route.innerHTML = html;
  damage.textContent = total + " damage";
}

opponentState.onchange = updateConditionUI;
hitState.onchange = updateConditionUI;

function makeNextSelect(number) {
  var wrap = document.getElementById("nextSlots");
  var label = document.createElement("label");
  label.textContent = number + "つ目の技";
  label.setAttribute("for", "next" + number);

  var select = document.createElement("select");
  select.id = "next" + number;
  select.disabled = false;
  select.add(new Option("技を選択してください", ""));

  Object.keys(MOVE_DATA).forEach(function(value) {
    select.add(new Option(MOVE_DATA[value].displayName, value));
  });

  select.addEventListener("change", function() {
    updateNext(select);
    updateComboValidity();
  });

  wrap.appendChild(label);
  wrap.appendChild(select);
  return select;
}

starter.onchange = function() {
  combo = [];
  var wrap = document.getElementById("nextSlots");
  wrap.innerHTML = "";

  if (starter.value) {
    var firstNext = makeNextSelect(2);
    firstNext.id = "next";
    status.textContent = "2つ目の技を選択してください。";
  } else {
    var label = document.createElement("label");
    label.textContent = "2つ目の技";
    var firstNext = document.createElement("select");
    firstNext.id = "next";
    firstNext.disabled = true;
    firstNext.add(new Option("先に始動技を選択してください", ""));
    wrap.appendChild(label);
    wrap.appendChild(firstNext);
    status.textContent = "始動技を選択してください。";
  }

  updateStarter();
  updateNext(getActiveNextSelect());
  render();
  updateComboValidity();
};

add.onclick = function() {
  var active = getActiveNextSelect();
  if (!active || !active.value) return;

  var value = parseInt(active.value, 10);
  if (!MOVE_DATA[String(value)]) return;

  combo.push(value);
  render();

  var number = combo.length + 2;
  var newSelect = makeNextSelect(number);
  status.textContent = number + "つ目の技を選択してください。";
  newSelect.focus();
  updateNext(newSelect);
  updateComboValidity();
};

clear.onclick = function() {
  combo = [];
  starter.value = "";
  var wrap = document.getElementById("nextSlots");
  wrap.innerHTML = '<label for="next">2つ目の技</label><select id="next" disabled><option value="">先に始動技を選択してください</option></select>';
  status.textContent = "コンボをクリアしました。";
  updateStarter();
  updateNext(getActiveNextSelect());
  render();
  updateComboValidity();
};

opponentState.onchange = updateConditionUI;
hitState.onchange = updateConditionUI;

updateStarter();
updateNext(getActiveNextSelect());
render();
updateComboValidity();
</script>
